spring.application.name=buensaborback
spring.jpa.hibernate.ddl-auto=update

# base de dato local
spring.datasource.url=jdbc:mysql://localhost:3306/buen_sabor?seSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# Configuracion de la subida de archivos
# Habilitar la subida de archivos en multiparte
spring.servlet.multipart.enabled=true
# Tama?o maximo de los archivos
spring.servlet.multipart.max-file-size=200MB
# Tama?o maximo de la peticion
spring.servlet.multipart.max-request-size=200MB
#tiempo de expera maximo del servido es de 20 segundos
#spring.mvc.async.request-timeout=20000
#ruta donde se guardan las imagenes
app.upload.dir=src/main/resources/img
#otra forma para guardar imagenes
spring.mvc.static-path-pattern=/img/**

# Configuración de logging para reducir advertencias de conexiones reseteadas
logging.level.org.springframework.web.context.request.async.AsyncRequestNotUsableException=ERROR
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# Configuración adicional para mejorar el manejo de conexiones
server.tomcat.connection-timeout=60000
server.tomcat.max-connections=8192
server.tomcat.max-threads=200

