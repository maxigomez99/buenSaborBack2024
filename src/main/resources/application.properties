spring.application.name=buensaborback
spring.jpa.hibernate.ddl-auto=update

# base de dato local
spring.datasource.url=jdbc:mysql://localhost:3306/buen_sabor?seSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# Configuracion de la subida de archivos
# Habilitar la subida de archivos en multiparte
spring.servlet.multipart.enabled=true
# Tamaño maximo de los archivos
spring.servlet.multipart.max-file-size=200MB
# Tamaño maximo de la peticion
spring.servlet.multipart.max-request-size=200MB
#tiempo de expera maximo del servido es de 20 segundos
#spring.mvc.async.request-timeout=20000
#ruta donde se guardan las imagenes
app.upload.dir=src/main/resources/img
#otra forma para guardar imagenes
spring.mvc.static-path-pattern=/img/**


# SECURITY
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-58djragnwq4awncc.us.auth0.com/
auth0.audience=http://localhost:8080/api
web.cors.allowed-origins=*
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG